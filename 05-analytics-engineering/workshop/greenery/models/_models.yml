version: 2

models:

  - name: my_users
    description: Greenery users
    columns:
      - name: user_id
        description: User ID
        data_tests:
          - not_null
          - unique
      - name: first_name
        description: User's first name
        data_tests:
          - not_null
      - name: last_name
        description: User's last name
        data_tests:
          - not_null
      - name: email
        description: User's email address
        data_tests:
          - not_null
          - unique
      - name: phone_number
        description: User's phone number
        data_tests:
          - not_null
      - name: created_at
        description: Timestamp when the user was created
        data_tests:
          - not_null
      - name: updated_at
        description: Timestamp when the user was last updated
        data_tests:
          - not_null
      - name: address_id
        description: Address ID
        data_tests:
          - not_null

  - name: my_events
    description: Greenery events
    columns:
      - name: event_id
        description: Event ID
        data_tests:
          - not_null
          - unique
          - dbt_expectations.expect_column_to_exist
          - dbt_expectations.expect_column_values_to_be_unique
      - name: session_id
        description: Session ID
        data_tests:
          - not_null
      - name: user_id
        description: User ID
        data_tests:
          - not_null
          - relationships:
              to: ref('my_users')
              field: user_id
      - name: page_url
        description: URL of the page where the event occurred
        data_tests:
          - not_null
      - name: created_at
        description: Timestamp when the event was created
        data_tests:
          - not_null
      - name: event_type
        description: Event Type
        data_tests:
          - accepted_values:
              values: ['page_view', 'add_to_cart', 'checkout', 'package_shipped']
      - name: order_id
        description: Order ID (only populated for checkout / package_shipped events)
      - name: product_id
        description: Product ID (only populated for add_to_cart events)